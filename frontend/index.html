<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вкусно дома — рецепты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <h1>Вкусно дома</h1>
        <p>Простые рецепты на каждый день</p>
    </header>

    <main class="main">
        <div class="filters">
            <button type="button" class="filter-btn active" data-filter="all">Все</button>
            <button type="button" class="filter-btn" data-filter="hot">Основные блюда</button>
            <button type="button" class="filter-btn" data-filter="dessert">Десерты</button>
            <button type="button" class="filter-btn" data-filter="drink">Напитки</button>
        </div>

        <h2 class="list-title">Рецепты</h2>

        <div id="recipes"></div>
    </main>

    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <button type="button" class="modal-close" id="modalClose">×</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <p>Учебный проект. Рецепты для примера.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
